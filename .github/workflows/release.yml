name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Linux build dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libxkbcommon-dev libfontconfig1-dev rpm
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: appimagetool
        run: |
          arch=$(uname -m)
          curl -fsSL -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x /usr/local/bin/appimagetool
      - run: APPIMAGE_EXTRACT_AND_RUN=1 packaging/linux/build-packages.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*.*

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - run: packaging/macos/build-app.sh
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS-macos

  windows:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            short: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            short: aarch64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --locked --target ${{ matrix.target }} -p linkspec-cli -p linkspec-service
          Remove-Item Env:RUSTFLAGS
          cargo build --release --locked --target ${{ matrix.target }} -p linkspec-app
      - name: Sign binaries (optional)
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD target\${{ matrix.target }}\release\*.exe
      - name: Package
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'linkspec-cli' | Select-Object -ExpandProperty version
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = "target\${{ matrix.target }}\release"
          Compress-Archive -Force -Path "$bin\linkspec.exe","README.md","LICENSE","THIRD_PARTY_LICENSES" -DestinationPath "dist\linkspec-$v-windows-${{ matrix.short }}.zip"
          dotnet tool install --global wix
          wix build packaging\windows\linkspec.wxs -arch ${{ matrix.arch }} -d Version=$v -d BinDir=$bin -o "dist\LinkSpec-$v-${{ matrix.arch }}.msi"
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File -Encoding ascii "dist\SHA256SUMS-windows-${{ matrix.short }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.short }}
          path: dist/*

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && cat SHA256SUMS-* > SHA256SUMS && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
