name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose draft should be created or updated (for example v0.9.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged application sources
        shell: bash
        run: git diff --exit-code "$RELEASE_TAG" -- . ':(exclude)packaging/**' ':(exclude).github/workflows/release.yml' ':(exclude)docs/**' ':(exclude)CHANGELOG.md'
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Linux build dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libxkbcommon-dev libfontconfig1-dev rpm
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: appimagetool
        run: |
          arch=$(uname -m)
          curl -fsSL -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x /usr/local/bin/appimagetool
      - run: APPIMAGE_EXTRACT_AND_RUN=1 packaging/linux/build-packages.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS-linux-*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged application sources
        shell: bash
        run: git diff --exit-code "$RELEASE_TAG" -- . ':(exclude)packaging/**' ':(exclude).github/workflows/release.yml' ':(exclude)docs/**' ':(exclude)CHANGELOG.md'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - run: packaging/macos/build-app.sh
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS-macos

  windows:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
            short: x86_64
          - target: aarch64-pc-windows-msvc
            arch: arm64
            short: aarch64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged application sources
        shell: bash
        run: git diff --exit-code "$RELEASE_TAG" -- . ':(exclude)packaging/**' ':(exclude).github/workflows/release.yml' ':(exclude)docs/**' ':(exclude)CHANGELOG.md'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --locked --target ${{ matrix.target }} -p linkspec-cli -p linkspec-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:RUSTFLAGS
          cargo build --release --locked --target ${{ matrix.target }} -p linkspec-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign binaries (optional)
        if: env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD target\${{ matrix.target }}\release\*.exe
      - name: Package
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'linkspec-cli' | Select-Object -ExpandProperty version
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = "target\${{ matrix.target }}\release"
          Compress-Archive -Force -Path "$bin\linkspec.exe","$bin\linkspec-app.exe","README.md","LICENSE","THIRD_PARTY_LICENSES" -DestinationPath "dist\linkspec-$v-windows-${{ matrix.short }}.zip"
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix build packaging\windows\linkspec.wxs -arch ${{ matrix.arch }} -d Version=$v -d BinDir=$bin -o "dist\LinkSpec-$v-${{ matrix.arch }}.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = @("dist\linkspec-$v-windows-${{ matrix.short }}.zip", "dist\LinkSpec-$v-${{ matrix.arch }}.msi")
          $checksums = $artifacts | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLower(), [IO.Path]::GetFileName($_) }
          $checksums | Out-File -Encoding ascii "dist\SHA256SUMS-windows-${{ matrix.short }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.short }}
          path: |
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS-windows-*
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd dist
          cat SHA256SUMS-* | tr -d '\r' > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | sort > "$RUNNER_TEMP/release-files"
          awk '{sub(/^\.\//, "", $2); print $2}' SHA256SUMS | sort > "$RUNNER_TEMP/checksummed-files"
          diff -u "$RUNNER_TEMP/release-files" "$RUNNER_TEMP/checksummed-files"
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
